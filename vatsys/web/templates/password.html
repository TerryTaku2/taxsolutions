{% extends "base.html" %}
{% block title %}Change password · VAT Computation System{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1>Change password</h1>
    {% if user.must_change_password %}
    <p class="muted">Your account was set up with a temporary password. Choose your own password to continue.</p>
    {% endif %}
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="current_password">{{ 'Temporary password' if user.must_change_password else 'Current password' }}</label>
      <input id="current_password" name="current_password" type="password" required autofocus autocomplete="current-password">
      <label for="new_password">New password (at least 10 characters)</label>
      <input id="new_password" name="new_password" type="password" minlength="10" required autocomplete="new-password">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password">
      <button>Save password</button>
    </form>
  </div>
</div>
{% endblock %}
