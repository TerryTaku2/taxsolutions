{% extends "base.html" %}
{% block title %}Create account · VAT Computation System{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1>Create account</h1>
    <p class="muted">The first account created becomes the administrator, who manages VAT rates, exchange rates and global rules.</p>
    <form method="post" action="/register">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="name">Your name</label>
      <input id="name" name="name" required autofocus>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username">
      <label for="password">Password (at least 10 characters)</label>
      <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password">
      <button>Create account</button>
    </form>
    <p class="small muted">Already registered? <a href="/login">Sign in</a>.</p>
  </div>
</div>
{% endblock %}
